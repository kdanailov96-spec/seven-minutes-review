name: Keep review comments alive

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh MantleDB namespace activity
        run: |
          curl --fail --silent --show-error \
            -X POST 'https://mantledb.sh/v2/seven-minutes-eurovision-2027-review-8f3c1a/heartbeat' \
            -H 'Content-Type: application/json' \
            --data "{\"status\":\"alive\",\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
